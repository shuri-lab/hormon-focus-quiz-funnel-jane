name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Routing — 560 combinations, and the doctor route is an exit
        run: npm test

      - name: Build
        run: npm run build

      # The CI box has no Chrome, so fetch Playwright's own Chromium and use it.
      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Interface — 5 viewport widths
        run: npx playwright test --project=phone-320 --project=phone-390 --project=desktop-1440
        env:
          PLAYWRIGHT_CHROMIUM_FALLBACK: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
